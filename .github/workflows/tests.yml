name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]     # 3.9 is what Raspberry Pi OS Bullseye ships
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow pytest

      - name: Unit tests
        run: pytest -q

      - name: Smoke test - render every LCD page from the demo data
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python -m netdisplay --demo examples/demo-data.yaml -c examples/homelab.yaml png out
          test "$(ls out/*.png | wc -l)" -eq 6
